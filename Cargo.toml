[package]
name = "sqlparser"
description = "Extensible SQL Lexer and Parser with composable dialects"
version = "2.0.0"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
documentation = "https://docs.rs/sqlparser/"
keywords = ["ansi", "sql", "lexer", "parser"]
repository = "https://github.com/apache/datafusion-sqlparser-rs"
license = "Apache-2.0"
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "LICENSE",
    "NOTICE",
]
edition = "2024"

[lib]
name = "sqlparser"
path = "src/lib.rs"

[workspace]
members = ["derive"]

[features]
visitor = ["dep:sqlparser_derive"]
serde = ["dep:serde", "dep:stacker", "dep:typed-arena"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
stacker = { version = "0.1", optional = true }
typed-arena = { version = "2", optional = true }
sqlparser_derive = { path = "derive", version = "0.1.0", optional = true }

[dev-dependencies]
criterion = "0.8"
# The original crate: the benchmark baseline and source of the shared corpus.
sqlparser_v1 = { package = "sqlparser", version = "=0.63.0" }
serde_json = { version = "1", features = ["unbounded_depth"] }

[[example]]
name = "parity"
test = true

[[bench]]
name = "v1_timing"
harness = false

[[bench]]
name = "v1_allocations"
harness = false
